is_debug: false
run_id: starvla
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]

framework:
  name: RynnBrainOFT
  qwenvl:
    base_vlm: /home/user01/jiangnan/starVLA/playground/Pretrained_models/RynnBrain-CoP-8B
    attn_implementation: flash_attention_2
    memory: true
    max_memory_step: 5
  dino:
    dino_backbone: dinov2_vits14
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 4096
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    past_action_window_size: 0
    num_actions_chunk: 8
    use_pro_version: true
  reduce_in_full_precision: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/data/jiangnan/lerobot
    data_mix: calvin_task_ABC_D
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av
    memory: true
    max_step: 5
    interval: 10
    num_workers: 0
    pin_memory: false
    persistent_workers: false
    prefetch_factor: null

trainer:
  epochs: 1
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 1.0e-05
    vlm_interface: 5.0e-06
    action_model: 5.0e-05
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true  